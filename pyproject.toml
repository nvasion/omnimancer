[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimancer-cli"
version = "0.2.25"
description = "A unified command-line interface for multiple AI language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kellan Strong", email = "kellan@jite.ai"}
]
keywords = ["ai", "cli", "chat", "openai", "claude", "language-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "click>=8.0.0",
    # >=15: Console tolerates stacked Live regions (_live_stack); 13.x had a
    # single _live slot and is below our tested floor.
    "rich>=15.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "certifi>=2023.0.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "psutil>=5.9.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2020.1.16",
    "jsonschema>=4.17.0",
    "readability-lxml>=0.8.1",
    # readability-lxml imports `lxml_html_clean.Cleaner`; lxml>=5.2 split
    # its html-cleaning code out of the core package into this module, so
    # it must be installed explicitly or `import readability` raises
    # ModuleNotFoundError on any lxml>=5.2 (breaks web_client's html
    # sanitizer import, which cascades into every collected test module).
    "lxml_html_clean>=0.1.0",
    "PyYAML>=6.0.0",
    "toml>=0.10.2",
    # <2: mcp 2.0 dropped mcp.server.fastmcp (breaks the MCP test server)
    # and its client surface is unvalidated against omnimancer/mcp/client.py.
    "mcp>=1.0.0,<2",
    "prompt-toolkit>=3.0.43,<4.0",
]

[project.optional-dependencies]
# The fleet dashboard (omn fleet) needs Textual; kept out of the core
# dependencies so headless/worker installs stay lean. Lazy-imported with a
# friendly install hint (see omnimancer/tui/fleet/cli.py).
tui = [
    "textual>=8.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    # For the Textual Pilot tests in tests/tui/.
    "textual>=8.0",
]

[project.scripts]
omnimancer = "omnimancer.cli.interface:main"
omn = "omnimancer.cli.interface:main"
omniman = "omnimancer.cli.interface:main"
# Claude Code hook adapter — a top-level stdlib-only module so each hook
# invocation starts in bare-python time (importing the omnimancer package
# would pull pydantic on every tool call).
omn-fleet-hook = "omn_fleet_hook:main"

[project.urls]
Homepage = "https://github.com/nvasion/omnimancer"
Repository = "https://github.com/nvasion/omnimancer"
Issues = "https://github.com/nvasion/omnimancer/issues"

[tool.setuptools]
py-modules = ["omn_fleet_hook"]

[tool.setuptools.packages.find]
where = ["."]
include = ["omnimancer*"]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.flake8]
max-line-length = 88
extend-ignore = "E203, W503, E701"
select = "C,E,F,W,B,B950"
exclude = ".git,__pycache__,build,dist,.venv,venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage flags are passed explicitly by CI (.gitlab-ci.yml / factory-pipeline.yml)
# so that a bare `pytest tests/` works without pytest-cov installed.
asyncio_mode = "auto"
markers = [
    "security: marks tests as security-related tests"
]